name: Offline Core compiler
on:
  push:
    branches: [agent/task-robustness-20260919]
    paths: [.github/workflows/core-compiler.yml]
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Copy compiler, public reference assemblies and runtime only
        shell: bash
        run: |
          set -euo pipefail
          root="$(dirname "$(readlink -f "$(which dotnet)")")"
          sdk="$(find "$root/sdk" -maxdepth 1 -name '8.0.*' -type d | sort -V | tail -1)"
          runtime="$(find "$root/shared/Microsoft.NETCore.App" -maxdepth 1 -name '8.0.*' -type d | sort -V | tail -1)"
          fxr="$(find "$root/host/fxr" -maxdepth 1 -name '8.0.*' -type d | sort -V | tail -1)"
          refs="$(find "$root/packs/Microsoft.NETCore.App.Ref" -maxdepth 1 -name '8.0.*' -type d | sort -V | tail -1)"
          mkdir -p kit/host/fxr kit/shared/Microsoft.NETCore.App kit/refs kit/compiler
          cp "$root/dotnet" kit/
          cp -a "$runtime" kit/shared/Microsoft.NETCore.App/
          cp -a "$fxr" kit/host/fxr/
          cp -a "$sdk/Roslyn/bincore/." kit/compiler/
          cp -a "$refs/ref/net8.0/." kit/refs/
          cp "$root/LICENSE.txt" "$root/ThirdPartyNotices.txt" kit/ || true
          kit/dotnet kit/compiler/csc.dll -version
      - uses: actions/upload-artifact@v4
        with:
          name: offline-core-compiler-linux
          path: kit/
          retention-days: 1
